aid: billgo
name: BillGO
description: 'BillGO is a Fort Collins, Colorado bill-payment technology company founded
  in 2015 that operates a real-time payments network connecting financial institutions,
  fintechs and billers. Its BillGO Exchange platform lets billers of any size receive
  electronic payments over ACH and one-time-use virtual cards instead of paper checks,
  and lets banks and credit unions embed real-time bill pay into their own applications.
  The Exchange web application at exchange.billgo.com is driven by a live GraphQL API
  with Okta-hosted OpenID Connect sign-in; the developer reference at docs.billgo.com
  is a private ReadMe project that redirects anonymous visitors to a login.'
